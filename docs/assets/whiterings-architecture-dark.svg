<text x="595.0" y="212" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle" fill="#EDF1F2">15 MIN</text>
<text x="595.0" y="236" font-size="12.5" text-anchor="middle" fill="#8B969C">before the event</text>
<text x="595.0" y="255" font-size="12.5" text-anchor="middle" fill="#8B969C">full-screen ring</text>
<line x1="699.0" y1="222.0" x2="721.0" y2="222.0" stroke="#818C92" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="725" y="174" width="200" height="96" rx="10" fill="#12171A"/>
