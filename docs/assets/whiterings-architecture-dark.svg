<rect x="48.0" y="366" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="128.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Exact alarm</text>
<text x="128.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">Doze-exempt</text>
<rect x="224.0" y="366" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="304.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Ring service</text>
<text x="304.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">wake lock + timeout</text>
<rect x="400.0" y="366" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="480.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Full screen</text>
<text x="480.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">over the lock screen</text>
<rect x="576.0" y="366" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="656.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Through DND</text>
<text x="656.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">except quiet hours</text>
<rect x="752.0" y="366" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="832.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Dismiss</text>
<text x="832.0" y="405" font-size="11.5" text-anchor="middle" fill="#8B969C">tap, confirm or sum</text>
<rect x="35" y="446" width="435" height="176" rx="10" fill="#12171A" stroke="#2C363C"/>
<text x="55" y="476" font-size="12" font-weight="700" letter-spacing="1.5" fill="#CDF546">RELIABILITY</text>
<rect x="55" y="495" width="8" height="8" fill="#CDF546"/>
<text x="73" y="504" font-size="13" fill="#EDF1F2">re-arms on 8 system events, incl. Direct Boot</text>
<rect x="55" y="519" width="8" height="8" fill="#CDF546"/>
<text x="73" y="528" font-size="13" fill="#EDF1F2">30-minute schedule heartbeat</text>
<rect x="55" y="543" width="8" height="8" fill="#CDF546"/>
<text x="73" y="552" font-size="13" fill="#EDF1F2">overlapping rings queued, never dropped</text>
<rect x="55" y="567" width="8" height="8" fill="#CDF546"/>
<text x="73" y="576" font-size="13" fill="#EDF1F2">ring self-timeout: never rings forever</text>
<rect x="55" y="591" width="8" height="8" fill="#CDF546"/>
<text x="73" y="600" font-size="13" fill="#EDF1F2">event → alarm planner covered by unit tests</text>
<rect x="490" y="446" width="435" height="176" rx="10" fill="#12171A" stroke="#2C363C"/>
<text x="510" y="476" font-size="12" font-weight="700" letter-spacing="1.5" fill="#CDF546">PRIVACY</text>
<rect x="510" y="495" width="8" height="8" fill="#CDF546"/>
<text x="528" y="504" font-size="13" fill="#EDF1F2">read-only Google Calendar scope</text>
<rect x="510" y="519" width="8" height="8" fill="#CDF546"/>
<text x="528" y="528" font-size="13" fill="#EDF1F2">no backend: the phone talks to Google only</text>
<rect x="510" y="543" width="8" height="8" fill="#CDF546"/>
<text x="528" y="552" font-size="13" fill="#EDF1F2">no stored secret: Play Services holds tokens</text>
<rect x="510" y="567" width="8" height="8" fill="#CDF546"/>
<text x="528" y="576" font-size="13" fill="#EDF1F2">system CAs only · allowBackup=false</text>
<rect x="510" y="591" width="8" height="8" fill="#CDF546"/>
<text x="528" y="600" font-size="13" fill="#EDF1F2">biometric app lock · no ads or trackers</text>
</svg>