<text x="480.0" y="73" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Calendar API</text>
<text x="480.0" y="91" font-size="11.5" text-anchor="middle" fill="#8B969C">direct, read-only</text>
<rect x="576.0" y="52" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="656.0" y="73" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Profiles</text>
<text x="656.0" y="91" font-size="11.5" text-anchor="middle" fill="#8B969C">cloneable rules</text>
<rect x="752.0" y="52" width="160.0" height="50" rx="8" fill="#12171A" stroke="#2C363C"/>
<text x="832.0" y="73" font-size="14" font-weight="700" text-anchor="middle" fill="#EDF1F2">Quiet hours</text>
<text x="832.0" y="91" font-size="11.5" text-anchor="middle" fill="#8B969C">per profile</text>
