<text x="825.0" y="212" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle" fill="#EDF1F2">AT START</text>
<text x="825.0" y="236" font-size="12.5" text-anchor="middle" fill="#8B969C">of the event</text>
<text x="825.0" y="255" font-size="12.5" text-anchor="middle" fill="#8B969C">full-screen ring</text>
<text x="480.0" y="296" font-size="12.5" text-anchor="middle" fill="#8B969C">Moved or cancelled events are removed on every refresh.</text>
<text x="35" y="330" font-size="12" font-weight="700" letter-spacing="1.5" fill="#CDF546">03  RING</text>
