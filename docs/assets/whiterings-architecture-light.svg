<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" width="960" height="642" font-family="'Brand Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="WhiteRings architecture: Google accounts and calendars are read through the Calendar API, every event gets a reminder chain from one day before to the start, and alarms ring full-screen through Do Not Disturb.">
