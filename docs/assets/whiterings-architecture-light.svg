<text x="35" y="40" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6D4DF5">01  SYNC · GOOGLE CALENDAR API, READ-ONLY</text>
<rect x="48.0" y="52" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
