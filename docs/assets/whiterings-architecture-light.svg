<line x1="656.0" y1="346" x2="656.0" y2="364" stroke="#818C92" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="832.0" y1="346" x2="832.0" y2="364" stroke="#818C92" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="48.0" y="366" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="128.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Exact alarm</text>
<text x="128.0" y="405" font-size="11.5" text-anchor="middle" fill="#55606A">Doze-exempt</text>
<rect x="224.0" y="366" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="304.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Ring service</text>
<text x="304.0" y="405" font-size="11.5" text-anchor="middle" fill="#55606A">wake lock + timeout</text>
<rect x="400.0" y="366" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="480.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Full screen</text>
<text x="480.0" y="405" font-size="11.5" text-anchor="middle" fill="#55606A">over the lock screen</text>
<rect x="576.0" y="366" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="656.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Through DND</text>
<text x="656.0" y="405" font-size="11.5" text-anchor="middle" fill="#55606A">except quiet hours</text>
<rect x="752.0" y="366" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="832.0" y="387" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Dismiss</text>
<text x="832.0" y="405" font-size="11.5" text-anchor="middle" fill="#55606A">tap, confirm or sum</text>
<rect x="35" y="446" width="435" height="176" rx="10" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="55" y="476" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6D4DF5">RELIABILITY</text>
<rect x="55" y="495" width="8" height="8" fill="#6D4DF5"/>
<text x="73" y="504" font-size="13" fill="#0F1416">re-arms on 8 system events, incl. Direct Boot</text>
<rect x="55" y="519" width="8" height="8" fill="#6D4DF5"/>
<text x="73" y="528" font-size="13" fill="#0F1416">30-minute schedule heartbeat</text>
<rect x="55" y="543" width="8" height="8" fill="#6D4DF5"/>
<text x="73" y="552" font-size="13" fill="#0F1416">overlapping rings queued, never dropped</text>
<rect x="55" y="567" width="8" height="8" fill="#6D4DF5"/>
<text x="73" y="576" font-size="13" fill="#0F1416">ring self-timeout: never rings forever</text>
<rect x="55" y="591" width="8" height="8" fill="#6D4DF5"/>
<text x="73" y="600" font-size="13" fill="#0F1416">event → alarm planner covered by unit tests</text>
<rect x="490" y="446" width="435" height="176" rx="10" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="510" y="476" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6D4DF5">PRIVACY</text>
<rect x="510" y="495" width="8" height="8" fill="#6D4DF5"/>
<text x="528" y="504" font-size="13" fill="#0F1416">read-only Google Calendar scope</text>
<rect x="510" y="519" width="8" height="8" fill="#6D4DF5"/>
<text x="528" y="528" font-size="13" fill="#0F1416">no backend: the phone talks to Google only</text>
<rect x="510" y="543" width="8" height="8" fill="#6D4DF5"/>
<text x="528" y="552" font-size="13" fill="#0F1416">no stored secret: Play Services holds tokens</text>
<rect x="510" y="567" width="8" height="8" fill="#6D4DF5"/>
<text x="528" y="576" font-size="13" fill="#0F1416">system CAs only · allowBackup=false</text>
<rect x="510" y="591" width="8" height="8" fill="#6D4DF5"/>
<text x="528" y="600" font-size="13" fill="#0F1416">biometric app lock · no ads or trackers</text>
</svg>