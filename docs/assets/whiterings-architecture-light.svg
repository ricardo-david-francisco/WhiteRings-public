<text x="304.0" y="91" font-size="11.5" text-anchor="middle" fill="#55606A">choose per account</text>
<rect x="400.0" y="52" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="480.0" y="73" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Calendar API</text>
<text x="480.0" y="91" font-size="11.5" text-anchor="middle" fill="#55606A">direct, read-only</text>
<rect x="576.0" y="52" width="160.0" height="50" rx="8" fill="#F4F7F8" stroke="#CBD2CE"/>
<text x="656.0" y="73" font-size="14" font-weight="700" text-anchor="middle" fill="#0F1416">Profiles</text>
<text x="656.0" y="91" font-size="11.5" text-anchor="middle" fill="#55606A">cloneable rules</text>
