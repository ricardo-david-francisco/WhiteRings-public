<text x="365.0" y="236" font-size="12.5" text-anchor="middle" fill="#55606A">before the event</text>
<text x="365.0" y="255" font-size="12.5" text-anchor="middle" fill="#55606A">gentle notification</text>
<line x1="469.0" y1="222.0" x2="491.0" y2="222.0" stroke="#818C92" stroke-width="1.6" marker-end="url(#ah)"/>
