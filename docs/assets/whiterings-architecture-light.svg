<text x="825.0" y="212" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle" fill="#0F1416">AT START</text>
<text x="825.0" y="236" font-size="12.5" text-anchor="middle" fill="#55606A">of the event</text>
<text x="825.0" y="255" font-size="12.5" text-anchor="middle" fill="#55606A">full-screen ring</text>
<text x="480.0" y="296" font-size="12.5" text-anchor="middle" fill="#55606A">Moved or cancelled events are removed on every refresh.</text>
<text x="35" y="330" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6D4DF5">03  RING</text>
<line x1="480.0" y1="306" x2="480.0" y2="346" stroke="#818C92" stroke-width="1.6"/>
<line x1="128.0" y1="346" x2="832.0" y2="346" stroke="#818C92" stroke-width="1.6"/>
